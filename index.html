<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유쾌한 소정샘의 역사 Class</title>
<script>
/* 배포 번호가 바뀌면 자동으로 새 화면을 불러옴 (배포할 때 __BUILD__ 자리에 번호가 들어갑니다) */
var BUILD = '__BUILD__';
(function () { try {
  if (BUILD.charAt(0) === '_' || location.protocol === 'file:') return;
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
    if (!v || !v.build || v.build === BUILD) return;
    var u = new URL(location.href); if (u.searchParams.get('b') === v.build) return;
    u.searchParams.set('b', v.build); location.replace(u.toString());
  }).catch(function () {});
} catch (e) {} })();
</script>
<meta name="application-name" content="소정샘 역사">
<meta name="apple-mobile-web-app-title" content="소정샘 역사">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6B62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'CheonsaengYeonbun';src:url('fonts/cheonsaeng-yeonbun.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'OmyuPretty';src:url('fonts/omyu-pretty.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'SejongGeulggot';src:url('fonts/sejong-geulggot.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'HUSummersea';src:url('fonts/hu-summersea.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--paper:#F6F2EA;--surface:#fff;--line:#E6DFD2;--ink:#1E2A3A;--muted:#6A7383;
--primary:#2F6B62;--primary-soft:#E3EFEB;--primary-deep:#1F4B45;--accent:#E0663F;--accent-soft:#FBE7DE;
--sky:#DCEBF5;--sky-deep:#3C6E94;--plum:#EAE4F3;--plum-deep:#6B5B95;--gold:#F7ECD3;--gold-deep:#B07F1E;--slate:#E7EAEE;--slate-deep:#475467;
--ok:#2F6B62;--bad:#C2410C;--shadow-card:0 4px 16px rgba(30,42,58,.08);--shadow-lift:0 12px 32px -4px rgba(30,42,58,.14);
--f-title:'CheonsaengYeonbun','Noto Serif KR',serif;--f-intro:'SejongGeulggot','HUSummersea',serif;--f-label:'OmyuPretty','HUSummersea',sans-serif;--f-body:'SejongGeulggot','HUSummersea','Noto Sans KR','Malgun Gothic',sans-serif;--serif:var(--f-body)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);font-size:22px;line-height:1.55;color:var(--ink);background:var(--paper);min-height:100vh;padding-bottom:110px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body[data-s="entry"],body[data-s="home"]{background:linear-gradient(#CFE3F1,#F6F2EA 75%)}
body[data-s="entry"]::before,body[data-s="home"]::before{content:'';position:fixed;left:0;right:0;bottom:0;height:23vh;background:#CFDCC8;z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;min-height:48px;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}
svg.ic{flex:none;vertical-align:middle}

/* 상단 바 */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center}
header.top h1{margin:0;font:400 1.7rem/1.3 var(--f-title)}
.acts{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:500;box-shadow:var(--shadow-card);color:var(--ink);text-decoration:none;min-height:48px}
.chip.soft{background:var(--primary-soft);color:var(--primary-deep);box-shadow:none}
.chip.on{background:var(--primary);color:#fff}
.tabs{display:inline-flex;gap:8px}
.wrap{max-width:1100px;margin:0 auto;padding:8px 32px 24px}
body.teacher .wrap{padding-left:132px;padding-right:132px}

/* 입장 */
#entry{text-align:center}
#entry h2{margin:8px 0 6px;font:400 3.4rem/1.2 var(--f-title)}
.hint{margin:0 0 4px;color:var(--muted)}
#houseSvg{width:min(480px,62vw,50vh);cursor:pointer;display:block;transition:transform .2s;flex:none}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:0;margin-top:14px}
.mascot{filter:drop-shadow(0 8px 10px rgba(30,42,58,.16));width:calc(min(480px,62vw,50vh) * .52);height:auto;margin-left:-14px;flex:none;margin-bottom:8px}
.tail{transform-origin:120px 60px;animation:sway 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(1.2deg)}50%{transform:rotate(-1.2deg)}}
.wave{transform-origin:150px 204px;animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-14deg)}}
@media(prefers-reduced-motion:reduce){.wave,.tail{animation:none}}
#houseSvg:active{transform:scale(.99)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:16px 36px;border:0;border-radius:999px;background:var(--primary);color:#fff;font-weight:500;box-shadow:var(--shadow-lift)}

/* 학교 안 */
.house{width:min(776px,100%);margin:34px auto 0;position:relative}
.roof{display:block;width:calc(100% + 72px);margin:0 -36px;height:auto;position:relative;z-index:1}
.eave{position:relative;z-index:2;height:46px;border-radius:12px;background:linear-gradient(#3A7E72,#173F38);box-shadow:0 6px 10px rgba(30,42,58,.25);margin:-4px -45px 0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.35rem;text-align:center}
.rooms{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;background:var(--surface);border-radius:0 0 20px 20px;box-shadow:var(--shadow-lift)}
.room{border:0;border-radius:22px;padding:22px 10px;min-height:200px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .15s}
.room:active{transform:scale(.97)}
.room .badge{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;margin-bottom:8px}
.room b{font-family:var(--f-label);font-size:1.65rem;font-weight:400}
.room small{font-size:1rem;color:var(--muted)}
.t-sky{--tint:var(--sky);--deep:var(--sky-deep)}.t-green{--tint:var(--primary-soft);--deep:var(--primary)}
.t-plum{--tint:var(--plum);--deep:var(--plum-deep)}.t-gold{--tint:var(--gold);--deep:var(--gold-deep)}
.t-coral{--tint:var(--accent-soft);--deep:var(--accent)}.t-slate{--tint:var(--slate);--deep:var(--slate-deep)}

/* 화면 공통 */
.vhead{display:flex;align-items:center;gap:16px;margin:4px 0 16px;flex-wrap:wrap}
.vhead h2{margin:0;font:700 1.875rem/1.3 var(--serif)}
.vhead .grow{flex:1}
.panel{background:var(--surface);border-radius:28px;padding:28px 32px;margin-top:8px;box-shadow:var(--shadow-card)}
.panel h2{margin:0 0 10px;font:700 1.5rem/1.3 var(--serif)}
.panel p.lead{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--primary);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:500}
.btn.sub{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}
.btn:disabled{opacity:.5}
input,textarea,select{font:inherit;font-size:22px;width:100%;padding:14px 16px;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;margin:6px 0 12px;color:var(--ink)}
textarea{resize:none}
input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;background:#fff}
label{font-weight:500;font-size:.95rem}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.msg{font-weight:500;margin:8px 0}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}

/* 달력 */
.calhead{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px}
.calhead h2{margin:0}
.circ{width:48px;height:48px;min-height:48px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;padding:0}
.circ:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dow{text-align:center;font-weight:500;padding:4px 0;color:var(--muted)}
.cal .dow:first-child,.cal .d.sun{color:var(--accent)}.cal .dow:nth-child(7),.cal .d.sat{color:var(--sky-deep)}
.cal .d{min-height:72px;border:0;border-radius:16px;background:var(--paper);padding:8px 10px;text-align:left;font-size:1rem;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.cal .d b{font-weight:700}
.cal .d.has{background:var(--primary-soft)}
.cal .d.today{box-shadow:inset 0 0 0 2.5px var(--accent)}
.slots{display:flex;gap:6px;margin-top:auto}
.sl{display:inline-flex;align-items:center;gap:3px;height:26px;padding:0 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);font-size:.85rem;background:#fff}
.sl.on{background:var(--primary);border-color:var(--primary);color:#fff}
.sl.s2.on{background:var(--gold-deep);border-color:var(--gold-deep)}
.cal .d.empty{visibility:hidden}

/* 수업 화면 */
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:12px}
.secard{background:var(--surface);border-radius:28px;padding:28px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:14px}
.secard .sh{display:flex;align-items:center;gap:12px}
.secard .num{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
.secard h3{margin:0;font:700 1.625rem/1.3 var(--serif)}
.secard p{margin:0;font-size:.95rem;color:var(--muted)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:132px;border-radius:22px;background:var(--tint);color:var(--ink);text-decoration:none;font-family:var(--f-label);font-weight:400;font-size:1.6rem;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .badge{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center}
.tile.off{opacity:.45;pointer-events:none}
.readtext{font-family:var(--f-intro);font-size:1.4rem;white-space:pre-wrap;line-height:1.8;background:var(--paper);border-radius:16px;padding:18px 20px;max-height:60vh;overflow:auto;word-break:keep-all}
.tilerow{display:grid;gap:10px}
.tilerow .tile{flex-direction:row;justify-content:flex-start;min-height:80px;font-size:1.3rem;gap:14px;padding:0 20px}
.tilerow .tile .badge{width:46px;height:46px;flex:none}
.tilerow .tile small{display:none}
.introtext{font-family:var(--f-intro);font-size:1.35rem;line-height:1.8;white-space:pre-wrap;background:var(--paper);border-radius:18px;padding:16px 18px;color:var(--ink);word-break:keep-all}
button.tile{border:0;width:100%;font-family:var(--f-label);cursor:pointer}
.tile small{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);margin-top:-6px}

/* AI / 보고서 */
.ai{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:24px;align-items:start}
.ai .panel{margin-top:0}
.aihead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.aihead .b{width:44px;height:44px;border-radius:14px;background:var(--plum);color:var(--plum-deep);display:grid;place-items:center}
.aihead h2{margin:0;font:700 1.375rem/1.3 var(--f-body)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:1.5px dashed var(--plum-deep);border-radius:18px;background:var(--plum);color:var(--plum-deep);font-weight:500;cursor:pointer;margin:0 0 14px}
.drop input{display:none}
#preview{max-width:100%;max-height:200px;border-radius:14px;margin:0 0 14px;display:block}
.ans{white-space:pre-wrap;background:var(--paper);border-radius:16px;padding:18px 20px;font-size:1rem;line-height:1.7}
.empty-ans{color:var(--muted);text-align:center;padding:40px 10px}
.narrow{max-width:760px;margin:8px auto 0}
.card{border-radius:16px;padding:16px 18px;margin:10px 0;background:var(--paper)}
.card h4{margin:0 0 4px;font-size:1.1rem}.card p{margin:4px 0;white-space:pre-wrap}
.card a{color:var(--primary);font-weight:500;text-decoration:none}

/* 하단 링크바 */
.bottom{position:fixed;left:0;right:0;bottom:24px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;padding:0 16px;z-index:20;pointer-events:none}
.bottom a{pointer-events:auto;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-label);font-size:1.25rem;font-weight:400;border-radius:999px;padding:13px 22px;background:var(--surface);box-shadow:var(--shadow-card);min-height:48px}
.bottom a .ic{color:var(--primary)}

/* 우측 도구 */
#dock,#dockL{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lift);z-index:25}
#dock button,#dock a,#dockL button{width:76px;height:76px;border-radius:20px;border:0;text-decoration:none;background:var(--primary-soft);color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
#dock button small,#dock a small,#dockL button small{font-family:var(--f-label);font-size:1.05rem;font-weight:400;color:var(--primary-deep);white-space:nowrap}
#dock button.on{background:var(--primary);color:#fff}#dock button.on small{color:#fff}
#dockL{right:auto;left:28px}
#dockL button.h2{background:var(--gold);color:var(--gold-deep)}#dockL button.h2 small{color:var(--gold-deep)}
/* 진도계획 */
.plan{padding:18px 20px}
.pu{border-radius:18px;background:var(--paper);margin:0 0 12px;overflow:hidden}
.pu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:1.25rem;min-height:56px}
.pu>summary::-webkit-details-marker{display:none}
.pu>summary::before{content:'\25B8';color:var(--primary);transition:transform .15s}
.pu[open]>summary::before{transform:rotate(90deg)}
.pu .un{flex:1}
.pu .cnt{font-size:.95rem;color:var(--primary-deep);background:var(--primary-soft);border-radius:999px;padding:2px 12px}
.pu .pm{padding:10px 18px 4px;color:var(--primary-deep);font-size:1.05rem;border-top:1px dashed var(--line)}
.ps{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 18px;flex-wrap:wrap}
.ps .mk{color:var(--primary);flex:none}
.ps .pt{flex:1;min-width:180px}
.ps .hr{font-size:.85rem;color:var(--muted);flex:none}
.ps .dch{font-size:.8rem;background:var(--gold);color:var(--gold-deep);border:0;border-radius:999px;padding:3px 10px;min-height:0;cursor:pointer}
.pbtn{width:46px;height:46px;min-height:46px;border-radius:50%;border:0;background:#fff;color:var(--muted);display:grid;place-items:center;padding:0;box-shadow:var(--shadow-card);flex:none}
.pbtn.on{background:var(--primary);color:#fff}
.crumb{color:var(--muted);margin:0 0 10px}
#tool{position:fixed;right:132px;top:50%;transform:translateY(-50%);width:min(380px,calc(100vw - 170px));max-height:80vh;overflow:auto;z-index:25;background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow-lift)}
#tool h3{margin:0 0 8px;font:700 1.25rem/1.3 var(--f-body)}
.big{font:700 3.4rem/1.2 var(--serif);text-align:center;margin:10px 0}

.viewer{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--surface);box-shadow:var(--shadow-card);font-size:1.2rem}
.viewer iframe{flex:1;border:0;width:100%;background:#fff}
.modal{position:fixed;inset:0;background:rgba(30,42,58,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:28px;padding:28px;width:min(440px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lift)}
.modal h3{margin:0 0 10px;font:700 1.375rem/1.3 var(--f-body)}
@media(max-width:900px){body{padding-bottom:170px}.secs,.ai{grid-template-columns:1fr}.rooms{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  body{font-size:17px;padding-bottom:24px}
  header.top{padding:12px 16px;flex-wrap:wrap;row-gap:8px}
  header.top h1{font-size:1.2rem}
  .logo{width:34px;height:34px}
  .chip{padding:8px 14px;min-height:42px}
  .wrap,body.teacher .wrap{padding:4px 16px 16px}
  #entry h2{font-size:2.3rem;margin-top:0}
  .stage{margin-top:8px}
  #houseSvg{width:60vw}
  .mascot{width:32vw;margin-left:-2vw;margin-bottom:4px}
  .cta{padding:14px 28px}
  .house{margin-top:18px}
  .roof{width:calc(100% + 24px);margin:0 -12px}
  .eave{margin:-4px -14px 0;height:40px;font-size:1.1rem}
  .rooms{grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
  .room{min-height:150px;padding:14px 6px;border-radius:18px}
  .room .badge{width:54px;height:54px;margin-bottom:4px}
  .room b{font-size:1.3rem}.room small{font-size:.85rem}
  .vhead{gap:10px}.vhead h2{font-size:1.5rem}
  .panel{padding:18px 14px;border-radius:22px}
  .calhead{gap:12px}.calhead h2{font-size:1.3rem}
  .cal{gap:4px}.cal .dow{font-size:.9rem}
  .cal .d{min-height:62px;padding:5px 5px;border-radius:12px;font-size:.95rem;min-width:0}
  .slots{gap:3px;flex-wrap:wrap}
  .sl{height:19px;padding:0 5px;font-size:.7rem;gap:0}.sl .ic{display:none}
  .secs{gap:14px}.secard{padding:20px}
  .tile{min-height:104px;font-size:1.4rem}
  .tilerow .tile{min-height:72px}
  .row>*{min-width:100%}
  .row>div[style*="flex:0 0"]{min-width:0}
  .bottom{position:static;margin:20px 0 0;padding:0 14px 96px;gap:8px}
  .bottom a{padding:11px 16px;font-size:1.1rem}
  body.teacher{padding-bottom:176px}
  .ps{flex-wrap:nowrap;gap:8px;padding:6px 10px 6px 14px}.ps .pt{min-width:0;font-size:1rem}.ps .hr{display:none}.ps .dch{display:none}.pu>summary{font-size:1.1rem;padding:12px 14px}
  #dockL{left:12px;right:12px;bottom:92px;top:auto;transform:none;flex-direction:row;justify-content:space-around;padding:8px;border-radius:24px}
  #dockL button{width:64px;height:64px;border-radius:18px}
  #dock{left:12px;right:12px;bottom:12px;top:auto;transform:none;flex-direction:row;justify-content:space-around;padding:8px;border-radius:24px}
  #dock button,#dock a{width:64px;height:64px;border-radius:18px}
  #tool{left:12px;right:12px;bottom:96px;top:auto;transform:none;width:auto;max-height:55vh}
  .big{font-size:2.6rem}
  .modal{padding:12px}.modal .box{padding:22px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>

<header class="top">
  <div class="brand"><span class="logo" data-ic="school" data-s="22"></span><h1>유쾌한 소정샘의 역사 Class</h1></div>
  <div class="acts"><button id="btnInstall" class="chip soft hidden"><span data-ic="download" data-s="18"></span>앱 설치</button><span id="who" class="chip hidden"></span><button id="btnLogin" class="chip"></button></div>
</header>

<main class="wrap">
  <!-- 집 외관 -->
  <section id="entry">
    <h2>유쾌한 소정샘의<br>역사 Class</h2>
    <p class="hint">문을 열고 들어오면 오늘의 역사 수업이 시작돼요</p>

    : ['<b>크롬</b> 또는 <b>엣지</b>로 이 주소를 엽니다.', '주소창 오른쪽 끝의 <b>설치 아이콘</b>(모니터에 화살표 모양)을 누릅니다. 없으면 오른쪽 위 <b>⋮ 메뉴 → 저장 및 공유 → 앱으로 설치</b>를 누릅니다.', '<b>설치</b>를 누르면 바탕화면과 시작 메뉴에 "소정샘 역사"가 생깁니다.'];
  var m = modal('<h3>앱 설치 방법</h3><p style="margin:0 0 8px;color:var(--muted)">' + (ios ? '아이폰·아이패드' : android ? '안드로이드' : '노트북·컴퓨터') + '에서는 이렇게 하세요.</p><ol style="margin:0 0 14px;padding-left:22px;line-height:1.7">' + steps.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol><button class="btn" style="width:100%">알겠어요</button>');
  m.querySelector('.btn').onclick = function () { m.remove(); };
};
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
