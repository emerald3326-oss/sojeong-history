<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유쾌한 소정샘의 역사 Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F2EA;--surface:#fff;--line:#E6DFD2;--ink:#1E2A3A;--muted:#6A7383;
--primary:#2F6B62;--primary-soft:#E3EFEB;--primary-deep:#1F4B45;--accent:#E0663F;--accent-soft:#FBE7DE;
--sky:#DCEBF5;--sky-deep:#3C6E94;--plum:#EAE4F3;--plum-deep:#6B5B95;--gold:#F7ECD3;--gold-deep:#B07F1E;--slate:#E7EAEE;--slate-deep:#475467;
--ok:#2F6B62;--bad:#C2410C;--shadow-card:0 4px 16px rgba(30,42,58,.08);--shadow-lift:0 12px 32px -4px rgba(30,42,58,.14);
--serif:'Noto Serif KR','Batang',serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:18px;line-height:1.55;color:var(--ink);background:var(--paper);min-height:100vh;padding-bottom:110px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body[data-s="entry"],body[data-s="home"]{background:linear-gradient(#CFE3F1,#F6F2EA 75%)}
body[data-s="entry"]::before,body[data-s="home"]::before{content:'';position:fixed;left:0;right:0;bottom:0;height:23vh;background:#CFDCC8;z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;min-height:48px;-webkit-user-select:none;user-select:none}
.hidden{display:none!important}
svg.ic{flex:none;vertical-align:middle}

/* 상단 바 */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center}
header.top h1{margin:0;font:700 1.25rem/1.3 var(--serif)}
.acts{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:500;box-shadow:var(--shadow-card);color:var(--ink);text-decoration:none;min-height:48px}
.chip.soft{background:var(--primary-soft);color:var(--primary-deep);box-shadow:none}
.wrap{max-width:1100px;margin:0 auto;padding:8px 32px 24px}
body.teacher .wrap{padding-left:132px;padding-right:132px}

/* 입장 */
#entry{text-align:center}
#entry h2{margin:8px 0 6px;font:700 2.75rem/1.25 var(--serif)}
.hint{margin:0 0 4px;color:var(--muted)}
#houseSvg{width:min(480px,80vw,50vh);cursor:pointer;display:block;margin:14px auto 0;transition:transform .2s}
#houseSvg:active{transform:scale(.99)}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:16px 36px;border:0;border-radius:999px;background:var(--primary);color:#fff;font-weight:500;box-shadow:var(--shadow-lift)}

/* 집 안 */
.house{width:min(776px,100%);margin:34px auto 0;position:relative}
.roof{display:block;width:calc(100% + 72px);margin:0 -36px;height:auto;position:relative;z-index:1}
.chimney{position:absolute;right:130px;top:26px;width:40px;height:84px;background:var(--accent);border-radius:4px;z-index:0}
.eave{position:relative;z-index:2;height:14px;border-radius:7px;background:var(--primary-deep);margin:-10px -45px 0}
.rooms{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;background:var(--surface);border-radius:0 0 20px 20px;box-shadow:var(--shadow-lift)}
.room{border:0;border-radius:22px;padding:22px 10px;min-height:200px;background:var(--tint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .15s}
.room:active{transform:scale(.97)}
.room .badge{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;margin-bottom:8px}
.room b{font-size:1.25rem;font-weight:700}
.room small{font-size:.875rem;color:var(--muted)}
.t-sky{--tint:var(--sky);--deep:var(--sky-deep)}.t-green{--tint:var(--primary-soft);--deep:var(--primary)}
.t-plum{--tint:var(--plum);--deep:var(--plum-deep)}.t-gold{--tint:var(--gold);--deep:var(--gold-deep)}
.t-coral{--tint:var(--accent-soft);--deep:var(--accent)}.t-slate{--tint:var(--slate);--deep:var(--slate-deep)}

/* 화면 공통 */
.vhead{display:flex;align-items:center;gap:16px;margin:4px 0 16px;flex-wrap:wrap}
.vhead h2{margin:0;font:700 1.875rem/1.3 var(--serif)}
.vhead .grow{flex:1}
.panel{background:var(--surface);border-radius:28px;padding:28px 32px;margin-top:8px;box-shadow:var(--shadow-card)}
.panel h2{margin:0 0 10px;font:700 1.5rem/1.3 var(--serif)}
.panel p.lead{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--primary);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:500}
.btn.sub{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}
.btn:disabled{opacity:.5}
input,textarea,select{font:inherit;font-size:18px;width:100%;padding:14px 16px;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;margin:6px 0 12px;color:var(--ink)}
textarea{resize:none}
input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;background:#fff}
label{font-weight:500;font-size:.95rem}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
.msg{font-weight:500;margin:8px 0}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}

/* 달력 */
.calhead{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px}
.calhead h2{margin:0}
.circ{width:48px;height:48px;min-height:48px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;padding:0}
.circ:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dow{text-align:center;font-weight:500;padding:4px 0;color:var(--muted)}
.cal .dow:first-child,.cal .d.sun{color:var(--accent)}.cal .dow:nth-child(7),.cal .d.sat{color:var(--sky-deep)}
.cal .d{min-height:78px;border:0;border-radius:16px;background:var(--paper);padding:8px 10px;text-align:left;font-size:1rem;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.cal .d b{font-weight:700}
.cal .d.has{background:var(--primary-soft)}
.cal .d.today{box-shadow:inset 0 0 0 2.5px var(--accent)}
.cal .d small{display:block;font-size:.75rem;line-height:1.3;color:var(--primary-deep)}
.cal .d.empty{visibility:hidden}

/* 수업 화면 */
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:12px}
.secard{background:var(--surface);border-radius:28px;padding:28px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:14px}
.secard .sh{display:flex;align-items:center;gap:12px}
.secard .num{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
.secard h3{margin:0;font:700 1.625rem/1.3 var(--serif)}
.secard p{margin:0;font-size:.875rem;color:var(--muted)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:132px;border-radius:22px;background:var(--tint);color:var(--ink);text-decoration:none;font-weight:700;font-size:1.25rem;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .badge{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center}
.tile.off{opacity:.45;pointer-events:none}
.tile small{font-weight:400;font-size:.8rem;color:var(--muted);margin-top:-6px}

/* AI / 보고서 */
.ai{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:24px;align-items:start}
.ai .panel{margin-top:0}
.aihead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.aihead .b{width:44px;height:44px;border-radius:14px;background:var(--plum);color:var(--plum-deep);display:grid;place-items:center}
.aihead h2{margin:0;font:700 1.375rem/1.3 'Noto Sans KR',sans-serif}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:1.5px dashed var(--plum-deep);border-radius:18px;background:var(--plum);color:var(--plum-deep);font-weight:500;cursor:pointer;margin:0 0 14px}
.drop input{display:none}
#preview{max-width:100%;max-height:200px;border-radius:14px;margin:0 0 14px;display:block}
.ans{white-space:pre-wrap;background:var(--paper);border-radius:16px;padding:18px 20px;font-size:1rem;line-height:1.7}
.empty-ans{color:var(--muted);text-align:center;padding:40px 10px}
.narrow{max-width:760px;margin:8px auto 0}
.card{border-radius:16px;padding:16px 18px;margin:10px 0;background:var(--paper)}
.card h4{margin:0 0 4px;font-size:1.1rem}.card p{margin:4px 0;white-space:pre-wrap}
.card a{color:var(--primary);font-weight:500;text-decoration:none}

/* 하단 링크바 */
.bottom{position:fixed;left:0;right:0;bottom:24px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;padding:0 16px;z-index:20;pointer-events:none}
.bottom a{pointer-events:auto;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:500;border-radius:999px;padding:13px 22px;background:var(--surface);box-shadow:var(--shadow-card);min-height:48px}
.bottom a .ic{color:var(--primary)}

/* 우측 도구 */
#dock{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lift);z-index:25}
#dock button,#dock a{width:76px;height:76px;border-radius:20px;border:0;text-decoration:none;background:var(--primary-soft);color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
#dock button small,#dock a small{font-size:.8rem;font-weight:500;color:var(--primary-deep);white-space:nowrap}
#dock button.on{background:var(--primary);color:#fff}#dock button.on small{color:#fff}
#tool{position:fixed;right:132px;top:50%;transform:translateY(-50%);width:min(380px,calc(100vw - 170px));max-height:80vh;overflow:auto;z-index:25;background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow-lift)}
#tool h3{margin:0 0 8px;font:700 1.25rem/1.3 'Noto Sans KR',sans-serif}
.big{font:700 3.4rem/1.2 var(--serif);text-align:center;margin:10px 0}

.modal{position:fixed;inset:0;background:rgba(30,42,58,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:28px;padding:28px;width:min(440px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lift)}
.modal h3{margin:0 0 10px;font:700 1.375rem/1.3 'Noto Sans KR',sans-serif}
@media(max-width:900px){.secs,.ai{grid-template-columns:1fr}#entry h2{font-size:2rem}.rooms{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>

<header class="top">

<main class="wrap">

  <!-- 집 내부(방 목록) -->

  <!-- 각 화면 -->

<script>
/* ===== 설정 (설정방법.md 참고) ===== */
var CONFIG = {
  BACKEND_URL: 'https://script.google.com/macros/s/AKfycbwm1q4j00k1HYbimoa_mDMcfwSn1DFyf7YhkOrJMkXnl7BbLKviJuTXndt_C4MmbfL02Q/exec',      // Apps Script 웹 앱 주소(…/exec)
  TEACHER_EMAIL: 'teacher@sojeong.kr',               // Firebase 선생님 계정 이메일
  FIREBASE: {                                        // Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹) 의 값
    apiKey: 'AIzaSyBmYbdZSo2mRiALs9J0JpBRsDwXL9InZzk',
    authDomain: 'sojeong-history-class.firebaseapp.com',
    databaseURL: 'https://sojeong-history-class-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId: 'sojeong-history-class',
    appId: '1:719725378048:web:2d874e9065ecec73cff6e5'
  }
};
firebase.initializeApp(CONFIG.FIREBASE);
var auth = firebase.auth(), db = firebase.database();
var ready = new Promise(function (res) {
  auth.onAuthStateChanged(function (u) {
    if (u) { res(u); if (u.email === CONFIG.TEACHER_EMAIL && !S.token) setTeacherUI(true); }
    else auth.signInAnonymously().catch(function () {});
  });
});
function isTeacher() { var u = auth.currentUser; return !!(u && u.email === CONFIG.TEACHER_EMAIL); }
function setTeacherUI(on) {
  S.token = on ? 'fb' : '';
  $('#btnLogin').innerHTML = ic('lock', 18) + (on ? '로그아웃' : '선생님'); document.body.classList.toggle('teacher', on);
  $('#dock').classList.toggle('hidden', !on);
}
function logout() { closeTool(); setTeacherUI(false); auth.signOut().then(function () { return auth.signInAnonymously(); }); }
function pad2(n) { return ('0' + n).slice(-2); }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dayStart() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function backend(action, p) {
  return ready.then(function () { return auth.currentUser.getIdToken(); }).then(function (t) {
    return fetch(CONFIG.BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ idToken: t, action: action }, p)) });
  }).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.error || '오류'); return j; });
}
function val(snap) { return snap.val() || {}; }
/* ---------- 아이콘 ---------- */
var IC = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', back: '<path d="m12 19-7-7 7-7M19 12H5"/>', left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',

var S = { me: null, token: '', ym: '', tool: '', bgmOn: false, timerId: null };
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function safe(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
function api(action, p) {
  p = p || {};
  return ready.then(function () { return route(action, p); });
}
function route(action, p) {
  var uid = auth.currentUser.uid;
  switch (action) {
    case 'login':
      return auth.signInWithEmailAndPassword(CONFIG.TEACHER_EMAIL, String(p.pw || '')).then(function () { return { ok: true, token: 'fb' }; })
        .catch(function () { throw new Error('암호가 맞지 않습니다.'); });
    case 'join':
      if (!p.name) throw new Error('이름을 입력하세요.');
      if (!isTeacher()) {
        var me = { cls: String(p.cls || '').slice(0, 10), no: String(p.no || '').slice(0, 5), name: String(p.name).slice(0, 20), t: firebase.database.ServerValue.TIMESTAMP };
        return db.ref('roster/' + uid).set(me).then(function () {
          setTimeout(function () { backend('log', { type: '입장', date: todayStr(), cls: me.cls, no: me.no, name: me.name }).catch(function () {}); }, Math.random() * 6000);
          return { ok: true };
        });
      }
      return Promise.resolve({ ok: true });
    case 'getMonth':
      return db.ref('lessons').once('value').then(function (s) {
        var all = val(s), days = {};
        Object.keys(all).forEach(function (d) { if (d.indexOf(p.ym) === 0) days[d] = all[d].title || ''; });
        return { ok: true, days: days, today: todayStr() };
      });
    case 'getLesson':
      return db.ref('lessons/' + p.date).once('value').then(function (s) { return { ok: true, lesson: s.val() }; });
    case 'saveLesson':
      var L = p.links || {}, links = { intro: safe(L.intro), summary: safe(L.summary), worksheet: safe(L.worksheet), activity: safe(L.activity) };
      var les = { date: p.date, title: String(p.title || '').slice(0, 100), body: String(p.body || '').slice(0, 2000), links: links };
      return db.ref('lessons/' + p.date).set(les).then(function () {
        backend('log', { type: '수업', date: p.date, title: les.title, body: les.body, extra: links }).catch(function () {});
        return { ok: true };
      });
    case 'getRoom':
      return db.ref('rooms/' + p.room).once('value').then(function (s) {
        var o = val(s), items = Object.keys(o).map(function (k) { var v = o[k]; v.seq = k; return v; }).sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
        return { ok: true, items: items };
      });
    case 'saveItem':
      var it = { date: String(p.date || todayStr()), title: String(p.title || '').slice(0, 100), body: String(p.body || '').slice(0, 3000), link: safe(p.link), t: firebase.database.ServerValue.TIMESTAMP };
      return db.ref('rooms/' + p.room).push(it).then(function () {
        backend('log', { type: p.room, date: it.date, title: it.title, body: it.body, link: it.link }).catch(function () {});
        return { ok: true };
      });
    case 'deleteItem':
      return db.ref('rooms/' + p.room + '/' + p.seq).remove().then(function () { return { ok: true }; });
    case 'ask':
      return backend('ask', p);
    case 'submit':
      return backend('submit', p);
    case 'getRoster':
      return db.ref('roster').once('value').then(function (s) {
        var o = val(s), st = dayStart();
        return { ok: true, roster: Object.keys(o).map(function (k) { return o[k]; }).filter(function (r) { return r.t >= st; }) };
      });
  }
  throw new Error('알 수 없는 요청');
}

function calendarView(ym) {

  api('getMonth', { ym: S.ym }).then(function (r) {
    var first = new Date(y, mo - 1, 1).getDay(), last = new Date(y, mo, 0).getDate(), h = '';
    ['일', '월', '화', '수', '목', '금', '토'].forEach(function (x) { h += '<div class="dow">' + x + '</div>'; });
    for (var i = 0; i < first; i++) h += '<div class="d empty"></div>';
    for (var n = 1; n <= last; n++) {
      var ds = S.ym + '-' + ('0' + n).slice(-2), dw = (first + n - 1) % 7;
      h += '<button class="d' + (r.days[ds] ? ' has' : '') + (ds === r.today ? ' today' : '') + (dw === 0 ? ' sun' : dw === 6 ? ' sat' : '') + '" data-d="' + ds + '"><b>' + n + '</b>' + (r.days[ds] ? '<small>' + esc(r.days[ds]) + '</small>' : '') + '</button>';

    $('#pm').onclick = function () { calendarView('2026-' + ('0' + (mo - 1)).slice(-2)); };

    var b = this; b.disabled = true; msg($('#am'), '선생님이 찾아보는 중…', true); $('#aa').innerHTML = '<div class="empty-ans">답을 찾고 있어요…</div>';
    api('ask', { text: t, image: aiImg, cls: S.me.cls, no: S.me.no, name: S.me.name })
      .then(function (r) { $('#am').textContent = ''; $('#aa').innerHTML = '<div class="ans">' + esc(r.answer) + '</div>'; })
      .catch(function (e) { msg($('#am'), e.message); }).then(function () { b.disabled = false; });
  };
}

/* ---------- 보고서 제출방 → 노션 ---------- */
function reportView() {
  show('view'); var m = S.me;
  $('#view').innerHTML = vhead('보고서 제출방') + '<div class="panel narrow"><p class="lead">링크를 올리면 선생님 노션에 자동으로 등록돼요.</p>' +
    '<div class="row"><div style="flex:0 0 150px"><label>학년·반</label><input id="rc" value="' + esc(m.cls) + '"></div><div style="flex:0 0 120px"><label>번호</label><input id="rn" type="number" value="' + esc(m.no) + '"></div><div><label>이름</label><input id="rm" value="' + esc(m.name) + '"></div></div>' +
    '<label>과제명</label><input id="rt" placeholder="예) 개항기 조약 정리 보고서"><label>제출 링크</label><input id="rl" placeholder="https://">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><span style="color:var(--primary-deep);font-size:.875rem">' + ic('check', 18) + ' 제출하면 노션 과제 수합표에 바로 기록돼요</span><button class="btn" id="rb">' + ic('send', 20) + '제출하기</button></div><div id="rmsg" class="msg"></div></div>';
  $('#rb').onclick = function () {
    var b = this; b.disabled = true; msg($('#rmsg'), '제출 중…', true);
    api('submit', { cls: $('#rc').value, no: $('#rn').value, name: $('#rm').value, title: $('#rt').value, link: $('#rl').value })
      .then(function () { msg($('#rmsg'), '제출 완료! 노션에 등록됐어요.', true); $('#rt').value = ''; $('#rl').value = ''; })
      .catch(function (e) { msg($('#rmsg'), e.message); }).then(function () { b.disabled = false; });
  };
}

/* ---------- 선생님 로그인 & 도구 ---------- */
$('#btnLogin').onclick = function () {
  if (S.token) { logout(); return; }
  var m = modal('<h3>선생님 전용</h3><input id="pw" type="password" placeholder="암호"><div id="pe" class="msg err"></div><button class="btn" id="pb" style="width:100%">확인</button>');
  var go = function () {
    api('login', { pw: $('#pw', m).value }).then(function () { m.remove(); setTeacherUI(true); })
      .catch(function (e) { $('#pe', m).textContent = e.message; });
  };
  $('#pb', m).onclick = go; $('#pw', m).onkeydown = function (e) { if (e.key === 'Enter') go(); }; $('#pw', m).focus();
};
function closeTool() { $('#tool').classList.add('hidden'); S.tool = ''; document.querySelectorAll('#dock button').forEach(function (b) { b.classList.remove('on'); }); }
$('#dock').onclick = function (e) {
  var b = e.target.closest('button'); if (!b) return; var t = b.dataset.tool;
  if (t === 'bgm') return toggleBgm();
  if (S.tool === t) return closeTool();
  closeTool(); S.tool = t; b.classList.add('on'); $('#tool').classList.remove('hidden');
  ({ pick: pickTool, timer: timerTool })[t]();
};

function pickTool() {
  $('#tool').innerHTML = '<h3>발표자 뽑기</h3><div class="big" id="pn">?</div><button class="btn" id="pg" style="width:100%">뽑기!</button>' +
    '<label>직접 명단 입력(쉼표 구분, 비우면 오늘 입장한 학생)</label><textarea id="pl" rows="2"></textarea><div id="pm2" class="msg"></div>';
  $('#pg').onclick = function () {
    var b = this, manual = $('#pl').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    var run = function (names) {
      if (!names.length) { msg($('#pm2'), '명단이 비었어요.'); return; }
      b.disabled = true; var n = 0, iv = setInterval(function () { $('#pn').textContent = names[Math.floor(Math.random() * names.length)]; if (++n > 20) { clearInterval(iv); b.disabled = false; $('#pn').textContent = names[Math.floor(Math.random() * names.length)]; } }, 80);
    };
    if (manual.length) run(manual);
    else api('getRoster').then(function (r) { run(r.roster.map(function (s) { return s.name + (s.no ? '(' + s.no + ')' : ''); })); }).catch(function (e) { msg($('#pm2'), e.message); });
  };
}
function timerTool() {
  var left = 0, run = false;
  $('#tool').innerHTML = '<h3>타이머</h3><div class="big" id="tt">05:00</div><div class="row"><input id="tm" type="number" min="0" value="5"><input id="ts" type="number" min="0" max="59" value="0"></div><small>분 / 초</small>' +
    '<div class="row"><button class="btn" id="t1">시작</button><button class="btn sub" id="t2">정지</button><button class="btn sub" id="t3">리셋</button></div>';
  function draw() { $('#tt').textContent = ('0' + Math.floor(left / 60)).slice(-2) + ':' + ('0' + left % 60).slice(-2); }
  function reset() { clearInterval(S.timerId); run = false; left = (Number($('#tm').value) || 0) * 60 + (Number($('#ts').value) || 0); draw(); }
  function beep() { try { var a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(function () { o.stop(); }, 900); } catch (e) {} }
  reset();
  $('#t1').onclick = function () { if (run) return; if (!left) reset(); run = true; clearInterval(S.timerId); S.timerId = setInterval(function () { left--; draw(); if (left <= 0) { clearInterval(S.timerId); run = false; beep(); $('#tt').textContent = '끝!'; } }, 1000); };
  $('#t2').onclick = function () { clearInterval(S.timerId); run = false; };
  $('#t3').onclick = reset;
}
function toggleBgm() {
  var h = $('#bgmHolder'), f = h.querySelector('iframe');
  if (!f) {
    h.innerHTML = '<iframe width="200" height="200" allow="autoplay" src="https://www.youtube.com/embed/VAoR8bL04qA?enablejsapi=1&autoplay=1&start=24&loop=1&playlist=VAoR8bL04qA"></iframe>';
    S.bgmOn = true;
  } else {
    S.bgmOn = !S.bgmOn;
    f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: S.bgmOn ? 'playVideo' : 'pauseVideo', args: [] }), '*');
  }
  $('#bgmBtn').classList.toggle('on', S.bgmOn);
}

/* 새로고침 시 저장된 정보로 빠른 입장 */
(function () { try { var m = JSON.parse(ls('sj_me') || 'null'); if (m && m.name) $('.hint').textContent = m.name + ' 학생, 문을 열고 들어오세요'; } catch (e) {} })();
paintIcons(); setTeacherUI(false); show('entry');
</script>
