name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 배포 번호 찍기 (브라우저가 예전 화면을 붙들고 있어도 새 화면으로 바꾸기 위함)
        run: |
          B="${GITHUB_SHA::10}"
          sed -i "s/__BUILD__/$B/g" index.html
          echo "{\"build\":\"$B\"}" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
