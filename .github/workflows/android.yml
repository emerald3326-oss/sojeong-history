name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sojeong-history.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sojeong-history-apk
          path: sojeong-history.apk
      - name: Publish release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest sojeong-history.apk \
            --title "소정샘 역사 앱 (Android APK)" \
            --notes "안드로이드용 설치 파일입니다. sojeong-history.apk 를 받아 설치하세요." \
            --latest=false
